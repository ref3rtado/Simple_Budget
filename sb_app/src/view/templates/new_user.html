{% extends "base.html" %}

{% block title %}Create Account{% endblock %}

{% block extra_head %}
    <script src="https://unpkg.com/htmx-ext-json-enc@2.0.1/json-enc.js" defer></script>
{% endblock %}

{% block content %}

    <div id="invite-section">
        <h1>Create Account</h1>
        
        <div id="invite-message" class="message hidden"></div>

        <form id="invite-form"
            hx-post="/user/check_invite"
            hx-ext="json-enc"
            hx-swap="none">

            <div class="form-group">
                <label for="invite-code">Invite Code <span class="required">*</span></label>
                <input
                    type="text"
                    id="invite-code"
                    name="invite_key"
                    maxlength="9"
                    placeholder="xxxx-xxxx"
                    required
                >
            </div>
            <button type="submit" class="btn-primary">Check Code</button>
        </form>
        <hr>
        <p>Already have an account? <a href="/">Log in here</a></p>
    </div>

    <div id="create-section" class="hidden">
        <h1>Create Account</h1>

        <div id="create-message" class="message hidden"></div>

        <form id="create-form" 
              hx-post="/user/add_user"
              hx-ext="json-enc"
              hx-swap="none">

            <div class="form-group">
                <label for="username">Username <span class="required">*</span></label>
                <input
                    type="text"
                    id="username"
                    name="name"
                    minlength="3"
                    maxlength="24"
                    required
                    placeholder="Enter a username"
                >
                <span class="field-error" id="err-name"></span>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    name="password1"
                    placeholder="Enter password"
                >
                <span class="field-error" id="err-password1"></span>
            </div>

            <div class="form-group">
                <label for="confirm-password">Confirm Password</label>
                <input
                    type="password"
                    id="confirm-password"
                    name="password2"
                    minlength="3"
                    maxlength="24"
                    placeholder="Confirm password"
                >
            <div class="form-group">
                <input
                   id="accepted-invite"
                   type="text"
                   name="invite_code"
                   hidden
                   >
                <input type="hidden" id="key-bool" name="used_code" value="false">
            </div>
                <span class="field-error" id="err-password2"></span>
            </div>

            <button type="submit" class="btn-primary">Create Account</button>
        </form>

        <hr>
        <p>Already have an account? <a href="/">Log in here</a></p>
    </div>
{% endblock %}

{% block scripts %}
    <script>
        document.body.addEventListener('keyValid', function (evt) {
            document.getElementById('invite-section').classList.add('hidden');
            document.getElementById('create-section').classList.remove('hidden');
            const goodInvite = document.getElementById('accepted-invite');
            const usedKey = document.getElementById('key-bool');
            goodInvite.value = evt.detail.invite_key;
            usedKey.value = true;
        });
         document.body.addEventListener('htmx:afterRequest', function (evt) {
        if (evt.detail.elt.id === 'invite-form') {
            const msg = document.getElementById('invite-message');
            msg.classList.remove('hidden', 'success', 'error');
            if (!evt.detail.successful) {
                const body = JSON.parse(evt.detail.xhr.responseText || '{}');
                msg.textContent = body.detail || 'Something went wrong. Please try again.';
                msg.classList.add('error');
                msg.classList.remove('hidden');
            }
        }

        if (evt.detail.elt.id === 'create-form') {
            const msg = document.getElementById('create-message');
            msg.classList.remove('hidden', 'success', 'error');
            if (evt.detail.successful) {
                msg.textContent = 'Account created successfully!';
                msg.classList.add('success');
                //TODO: route to landing page
            } else {
                const body = JSON.parse(evt.detail.xhr.responseText || '{}');
                const detail = body.detail;
                msg.textContent = Array.isArray(detail)
                    ? detail.map(e => e.msg.replace(/^Value error,\s*/i, '')).join(' ')
                    : detail || 'Something went wrong.';
                msg.classList.add('error');
            }
            msg.classList.remove('hidden');
        }
    });

    </script>
{% endblock %}
